 '<td class="'+ownCls+'">'+content+'</td>';});if(S.gyms.length < 3)h+= '<td class="gym-comp-td-add-gym"></td>';h+= '<td style="background:#fff;width:28px;"></td></tr>';document.getElementById('gc-tfoot').innerHTML = h;}function syncOwnToggle(){var table = document.querySelector('.gym-comp-table');if(!table)return;if(ownHidden)table.classList.add('gym-comp-own-hidden');else table.classList.remove('gym-comp-own-hidden');var tb = document.getElementById('gc-toggle-own-toolbar');if(tb)tb.style.display = ownHidden ? '' : 'none';}function renderAll(){renderThead();renderTbody();renderTfoot();syncOwnToggle();}window.gcCellInput = function(el){S.cells[el.dataset.cell] = el.type==='checkbox' ?(el.checked ? '1' : '0'): el.value;renderTfoot();scheduleAutoSend();};window.gcPeriodInput = function(el){S.cells[el.dataset.period] = el.value;renderTfoot();scheduleAutoSend();};document.addEventListener('input',function(e){var el = e.target;if(el.dataset.gidx!==undefined){var idx = parseInt(el.dataset.gidx,10);if(S.gyms[idx])S.gyms[idx].name = el.value;scheduleAutoSend();}});window.gcUpdateLabels = function(){var type = document.getElementById('gc-new-type').value;var sel = document.getElementById('gc-new-label-sel');var txt = document.getElementById('gc-new-label-txt');if(!type){sel.style.display = 'none';txt.style.display = 'none';return;}if(type==='count'){sel.style.display = 'none';txt.style.display = '';txt.placeholder = '項目名（例：回数）';}else{sel.style.display = '';sel.innerHTML =(LABEL_PRESETS[type]||['その他']).map(function(p){return '<option value="'+esc(p)+'">'+esc(p)+'</option>';}).join('');window.gcToggleCustom();}};window.gcToggleCustom = function(){var sel = document.getElementById('gc-new-label-sel');var txt = document.getElementById('gc-new-label-txt');if(sel.style.display==='none')return;var isOther = sel.value==='その他';txt.style.display = isOther ? '' : 'none';if(!isOther)txt.value = '';};window.gcAddRow = function(){var type = document.getElementById('gc-new-type').value;var sel = document.getElementById('gc-new-label-sel');var txt = document.getElementById('gc-new-label-txt');var label;if(!type){showToast('タイプを選択してください');document.getElementById('gc-new-type').focus();return;}if(type==='count'){label = txt.value.trim()||'回数';}else{label = sel.value==='その他' ? txt.value.trim(): sel.value;}if(!label){showToast('項目名を入力してください');txt.focus();return;}var id = nextRid();S.rows.push({id:id,type:type,label:label});S.gyms.slice(1).forEach(function(gym){S.cells[id+'-'+gym.id] = type==='option' ? '0' : '';});txt.value = '';window.gcUpdateLabels();renderAll();showToast('「'+label+'」を追加しました');};window.gcRemoveRow = function(rid){if(isDefault(rid)){showToast('デフォルト行は削除できません');return;}S.rows = S.rows.filter(function(r){return r.id!==rid;});Object.keys(S.cells).forEach(function(k){if(k.indexOf(rid+'-')===0)delete S.cells[k];});renderAll();};window.gcAddGym = function(){if(S.gyms.length>=3){showToast('最大3社まで追加できます');return;}var id = nextGid();var name = 'ジム'+CIRCLE[S.gyms.length-1];S.gyms.push({id:id,name:name,isOwn:false});S.rows.forEach(function(row){S.cells[row.id+'-'+id] = row.type==='option' ? '0' : '';});if(S.rows.some(function(r){return r.id==='r3';}))S.cells['r3-'+id+'-p'] = '1';renderAll();};window.gcRemoveGym = function(gid){S.gyms = S.gyms.filter(function(g){return g.id!==gid;});Object.keys(S.cells).forEach(function(k){if(k.slice(-(gid.length+1))==='-'+gid||k==='r3-'+gid+'-p')delete S.cells[k];});renderAll();};window.gcSwitchTab = function(tab){if(tab===currentTab)return;clearTimeout(_debounceTimer);sendToGAS(buildPayload('tab_switch'));TAB_STATES[currentTab] = cloneState(S);currentTab = tab;if(tab==='personal'){OWN = PERSONAL_OWN;DEFAULT_ROWS = PERSONAL_DEFAULT_ROWS;}else{OWN = FITNESS_OWN;DEFAULT_ROWS = FITNESS_DEFAULT_ROWS;}DEFAULT_IDS = DEFAULT_ROWS.map(function(r){return r.id;});S = TAB_STATES[tab]||cloneState(tab==='fitness' ? FITNESS_INITIAL_S : S);normCount = 0;ownHidden = false;document.querySelectorAll('.gym-comp-tab').forEach(function
